spring:
  application:
    name: service-subtract

server:
  port: 8040

eureka:
  instance:
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${random.int}
    lease-renewal-interval-in-seconds: 10

info:
  app:
    name: EurekaClient Clase13 service-subtract
management:
  endpoints:
    web:
      exposure:
        include: health,beans,loggers,info
